spring:
  application:
    name: sentra-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sentra}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user, repo

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

sentra:
  ingestion:
    async:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 10
    chunk:
      size-tokens: 400
      overlap-tokens: 50
    repo:
      max-files: 500
      max-total-extracted-bytes: 52428800

  rag:
    top-k: 20

  security:
    token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
    jwt-secret: ${JWT_SECRET:}
    allowed-origins: ${ALLOWED_ORIGINS}

logging:
  level:
    dev.langchain4j: INFO

paddle:
  api-key: ${PADDLE_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never